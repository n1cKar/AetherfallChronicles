<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Aetherfall Chronicles</title>
  <link rel="stylesheet" href="/src/styles/global.css" />
  <link rel="stylesheet" href="/src/styles/menu.css" />
</head>
<body class="settings-page">
  <div class="splash-bg"></div>
  <main class="settings-content panel">
    <h1 class="fantasy-title">Settings</h1>
    <form id="settings-form" class="settings-form">
      <label>Master Volume <input type="range" id="masterVolume" min="0" max="1" step="0.05" /></label>
      <label>Music Volume <input type="range" id="musicVolume" min="0" max="1" step="0.05" /></label>
      <label>SFX Volume <input type="range" id="sfxVolume" min="0" max="1" step="0.05" /></label>
      <label>Graphics Quality
        <select id="graphicsQuality">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high" selected>High</option>
          <option value="ultra">Ultra</option>
        </select>
      </label>
      <label><input type="checkbox" id="shadows" checked /> Shadows</label>
      <label><input type="checkbox" id="bloom" checked /> Bloom</label>
      <label><input type="checkbox" id="showDamageNumbers" checked /> Damage Numbers</label>
      <label><input type="checkbox" id="autoLoot" checked /> Auto Loot</label>
      <label>Particles
        <select id="particles">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high" selected>High</option>
        </select>
      </label>
      <label>Controller Sensitivity <input type="range" id="controllerSensitivity" min="0.5" max="2" step="0.1" /></label>
    </form>
    <div class="settings-actions">
      <button id="btn-save" class="btn">Save</button>
      <a href="/index.html" class="btn btn-secondary">Back</a>
    </div>
    <p id="save-status" class="save-status"></p>
  </main>
  <footer class="credits-footer"><strong>Developed by n1ckar</strong></footer>
  <script type="module" src="/src/pages/settings.ts"></script>
</body>
</html>
